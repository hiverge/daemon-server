name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Match the exact interpreter the release binary is built against.
          python-version: "3.12.8"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        # `--no-install-project` reads the dependencies without building the
        # project, which flat-layout repositories like this one cannot do.
        run: uv sync --no-install-project

      - name: Run tests
        # `python -m` so the repository root is on `sys.path` and the suite can
        # import the server modules it tests.
        run: uv run --no-sync python -m pytest -v
