name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the exact interpreter the release binary is built against.
          python-version: "3.12.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The suite imports both server modules, so it needs their runtime
          # dependencies as declared in pyproject.toml, plus pytest itself.
          python -m pip install pytest flask waitress requests psutil python-json-logger

      - name: Run tests
        run: python -m pytest -v
