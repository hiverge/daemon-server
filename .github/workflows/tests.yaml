name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Match the exact interpreter the release binary is built against.
          python-version: "3.12.8"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install dependencies
        # `--no-install-project` reads the dependencies without building the
        # project, which flat-layout repositories like this one cannot do.
        run: uv sync --no-install-project

      - name: Run tests
        # `python -m` so the repository root is on `sys.path` and the suite can
        # import the server modules it tests.
        run: uv run --no-sync python -m pytest -v
