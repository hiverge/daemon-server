[project]
name = "daemon-server"
version = "0.1.0"
description = "Standalone daemon server for executing code and health checks in sandbox containers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "flask>=3.0.0",
  "waitress>=3.0.0",
  "requests>=2.31.0",
  "psutil>=5.9.0",
  "python-json-logger>=2.0.4"
]

[tool.ruff]
# Match the repo's existing 2-space indentation.
indent-width = 2
